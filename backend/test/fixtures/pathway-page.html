<!--
    Hand-written structural stand-in for a KEGG pathway page, not real KEGG
    content. It exists only to give findPathway() a `<map id="mapdata">`
    with one `<area>` of each supported shape (rect, circle, poly) to parse.
-->
<html>
    <body>
        <map name="pathwaymap" id="mapdata">
            <area shape="rect" coords="10,20,30,40" href="#" title="Node A" />
            <area shape="circle" coords="50,60,15" href="#" title="Node B" />
            <area shape="poly" coords="1,2,3,4,5,6" href="#" title="Node C" />
        </map>
    </body>
</html>
