server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite puts a content hash in each asset file name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API is a separate container; a request for it that reaches this one is a routing error.
    location /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
