version: 2

updates:
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 99
    groups:
      # eslint and @eslint/js release together, majors included.
      eslint:
        patterns: ["eslint", "@eslint/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 99
    groups:
      # eslint and @eslint/js release together, majors included.
      eslint:
        patterns: ["eslint", "@eslint/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/web"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
