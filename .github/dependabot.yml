version: 2

updates:
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 99

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 99
    groups:
      typescript-tooling:
        patterns:
          - "typescript"
          - "vue-tsc"
          - "@vue/*"
          - "@vitejs/*"
          - "vite"
          - "eslint*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Brussels"
