# Releases a tag vX.Y.Z or vX.Y.Z-<pre>. See deploy/README.md.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Tag matches the package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          if ! git merge-base --is-ancestor "$tag" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$tag is not on $DEFAULT_BRANCH. Merge first, then tag."
            exit 1
          fi
          if [[ ! $tag =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not vX.Y.Z or vX.Y.Z-<pre>."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ -z "${BASH_REMATCH[4]}" ]; then
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi
          for dir in backend web; do
            declared=$(jq -r .version "$dir/package.json")
            if [ "v$declared" != "$tag" ]; then
              echo "::error::$tag does not match the $dir/package.json version $declared."
              exit 1
            fi
          done

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml

  images:
    needs: [guard, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ github.ref_name }}
      version: ${{ needs.guard.outputs.version }}
      minor: ${{ needs.guard.outputs.minor }}

  release:
    name: GitHub release
    needs: [guard, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.minor == '' }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --prerelease="$PRERELEASE"
