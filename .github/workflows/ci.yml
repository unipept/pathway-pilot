name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web · typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs `vue-tsc --noEmit` before `vite build`, so this covers
      # both typechecking and the production build in one step.
      - name: Typecheck and build
        run: npm run build

  backend:
    name: backend · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  backend-test:
    name: backend · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The suite generates and tears down its own fixture (see
      # test/globalSetup.ts), so it needs no env setup step and no network.
      - name: Test
        run: npm test

  backend-boot:
    name: backend · boots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        # backend/data is not tracked in git -- it is a cached copy of
        # rest.kegg.jp seeded by `npm run refresh-data`, far too slow and too
        # large for a smoke test. Generate a throwaway stand-in instead, so
        # this job needs no network and no cache, and nothing that looks like
        # KEGG data is committed. Drift against real KEGG is checked monthly
        # by .github/workflows/kegg-refresh-check.yml.
        run: |
          npm run fixture
          cp .env.example .env
          sed -i 's|^DATA_DIR=.*|DATA_DIR=.fixture/|' .env
          sed -i 's|^LINK_DIR=.*|LINK_DIR=.fixture/link/|' .env

      - name: Boot the backend and smoke test it
        run: |
          set -o pipefail

          npm run serve > server.log 2>&1 &
          SERVER_PID=$!

          booted=false
          for i in $(seq 1 60); do
            if grep -q "Server is running" server.log; then
              booted=true
              break
            fi
            sleep 1
          done

          if [ "$booted" != "true" ]; then
            echo "Backend did not log 'Server is running' within 60 seconds"
            cat server.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          # /mapping/ec/:id reads the data files and joins across five of them,
          # so it exercises the parsers and the mapping layer. /pathway/:id
          # would not -- it scrapes www.kegg.jp and touches no local data.
          body=$(curl -s http://localhost:3000/mapping/ec/1.1.1.1)
          kill "$SERVER_PID" 2>/dev/null || true

          echo "Response: $body"

          for expected in '"K00001"' '"R00623"' '"map00010"' '"alcohol dehydrogenase"'; do
            case "$body" in
              *"$expected"*) ;;
              *)
                echo "Expected $expected in the /mapping/ec/1.1.1.1 response"
                cat server.log
                exit 1
                ;;
            esac
          done

          echo "Backend booted and resolved EC 1.1.1.1 across the fixture"

      - name: Remove the generated fixture
        # The runner is thrown away regardless, but keeping teardown explicit
        # means the same two commands work locally without leaving files behind.
        if: always()
        run: npm run fixture -- --clean
