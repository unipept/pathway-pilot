name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web · typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs `vue-tsc --noEmit` before `vite build`, so this covers
      # both typechecking and the production build in one step.
      - name: Typecheck and build
        run: npm run build

  backend:
    name: backend · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  backend-boot:
    name: backend · boots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        run: cp .env.example .env

      # `npm run serve` is the documented way to start the backend
      # (nodemon -> ts-node). We exercise that exact command rather than
      # a plain `node` invocation so a broken ts-node/typescript toolchain
      # fails CI instead of only surfacing at boot time for a developer.
      - name: Boot the backend and smoke test it
        run: |
          set -o pipefail

          npm run serve > server.log 2>&1 &
          SERVER_PID=$!

          booted=false
          for i in $(seq 1 60); do
            if grep -q "Server is running" server.log; then
              booted=true
              break
            fi
            sleep 1
          done

          if [ "$booted" != "true" ]; then
            echo "Backend did not log 'Server is running' within 60 seconds"
            cat server.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/pathway/map00010)
          kill "$SERVER_PID" 2>/dev/null || true

          if [ "$status" != "200" ]; then
            echo "Expected HTTP 200 from /pathway/map00010, got $status"
            cat server.log
            exit 1
          fi

          echo "Backend booted and served /pathway/map00010 with $status"
